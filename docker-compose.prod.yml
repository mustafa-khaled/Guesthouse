services:
  mongodb:
    ports: []
    environment:
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD must be set}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-guesthouse_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD must be set}
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    ports: []
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  backend:
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-guesthouse}/guesthouse-backend:${IMAGE_TAG:-latest}
    ports: []
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME:-guesthouse_app}:${MONGO_APP_PASSWORD:?required}@mongodb:27017/guesthouse?authSource=guesthouse
      REDIS_URL: redis://:${REDIS_PASSWORD:?required}@redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-90}
      SENTRY_DSN: ${SENTRY_DSN:-}
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  frontend:
    image: ${REGISTRY:-ghcr.io}/${GITHUB_REPOSITORY:-guesthouse}/guesthouse-frontend:${IMAGE_TAG:-latest}
    ports: []
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:5000
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  nginx:
    image: nginx:1.27-alpine
    container_name: guesthouse-nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
