packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  nx: true
  esbuild: true
  mongodb-memory-server: true
  '@scarf/scarf': true
  msgpackr-extract: true

onlyBuiltDependencies:
  - sharp
  - nx
  - esbuild
  - mongodb-memory-server
  - '@scarf/scarf'
  - msgpackr-extract

overrides:
  shell-quote: '>=1.8.4'
  form-data: '>=4.0.6'
