name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish Images
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'master'))
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Validate frontend build args
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_API_URL }}" ]; then
            echo "::error::NEXT_PUBLIC_API_URL repository variable is not set"
            exit 1
          fi
          if [ -z "${{ vars.NEXT_PUBLIC_SOCKET_URL }}" ]; then
            echo "::error::NEXT_PUBLIC_SOCKET_URL repository variable is not set"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          REPO="${{ github.repository }}"
          echo "backend_image=${REGISTRY}/${REPO}/guesthouse-backend:${SHA}" >> $GITHUB_OUTPUT
          echo "frontend_image=${REGISTRY}/${REPO}/guesthouse-frontend:${SHA}" >> $GITHUB_OUTPUT
          echo "backend_latest=${REGISTRY}/${REPO}/guesthouse-backend:latest" >> $GITHUB_OUTPUT
          echo "frontend_latest=${REGISTRY}/${REPO}/guesthouse-frontend:latest" >> $GITHUB_OUTPUT
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.backend_image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.frontend_image }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ vars.NEXT_PUBLIC_SOCKET_URL }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.backend_image }}
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.frontend_image }}
          format: table
          exit-code: 1
          severity: CRITICAL

      - name: Push backend image
        run: |
          docker tag ${{ steps.meta.outputs.backend_image }} ${{ steps.meta.outputs.backend_latest }}
          docker push ${{ steps.meta.outputs.backend_image }}
          docker push ${{ steps.meta.outputs.backend_latest }}

      - name: Push frontend image
        run: |
          docker tag ${{ steps.meta.outputs.frontend_image }} ${{ steps.meta.outputs.frontend_latest }}
          docker push ${{ steps.meta.outputs.frontend_image }}
          docker push ${{ steps.meta.outputs.frontend_latest }}
